<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ikna</title>
  <meta name="description" content="Remember anything with spaced repetition: exam material, facts, definitions, formulas, vocabulary.">
  <meta name="theme-color" content="#2f6f5e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the first paint, so dark mode doesn't flash.
    try { var t = localStorage.getItem("ikna:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img src="icon.svg" alt="">Ikna</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-tab="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a href="#/browse" data-tab="browse"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Browse</a>
      <a href="#/add" data-tab="add"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Add</a>
      <a href="#/stats" data-tab="stats"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Progress</a>
      <a href="#/settings" data-tab="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>Settings</a>
    </nav>
    <div class="streak" id="streak" title="Days in a row you studied"></div>
    <a class="sync-dot" id="syncDot" href="#/settings?section=account" hidden data-state="off"><span aria-hidden="true"></span></a>
  </header>
  <main id="app" tabindex="-1"><p class="muted center">Loading…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Icon sprite (simple line icons). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-7M11 20V5M16 20v-10M20 20v-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  </svg>

  <script src="js/config.js"></script>
  <script src="core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/rich.js"></script>
  <script src="js/occlusion.js"></script>
  <script src="js/share.js"></script>
  <script src="js/transfer.js"></script>
  <script src="js/quick.js"></script>
  <script src="js/openai-client.js"></script>
  <script src="js/ai-client.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/deck.js"></script>
  <script src="js/screens/study.js"></script>
  <script src="js/screens/exam.js"></script>
  <script src="js/screens/note.js"></script>
  <script src="js/screens/browse.js"></script>
  <script src="js/screens/import.js"></script>
  <script src="js/screens/stats.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
